# Phase 7 §7 / Phase 12: CI。PRごとに解析・テスト・コンテンツ検証を実行。
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.22.x", channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test # 状態機械6 + コアジャーニー2
        working-directory: app

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: functions/package.json }
      - run: npm install
        working-directory: functions
      - run: npx tsc --noEmit
        working-directory: functions
      - run: npm test # domain 14 + quality 13
        working-directory: functions

  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g firebase-tools
      - run: npm install
        working-directory: functions
      - run: npm install
        working-directory: firebase/tests
      # ルールテスト + deliverQuest結合テストをエミュレータ内で実行
      - run: |
          firebase emulators:exec --only firestore --project design-kingdom-test '
            (cd firebase/tests && npm test) &&
            (cd functions && npm run test:integration)
          '

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: content
      - run: npm run validate # スキーマ+参照整合性(マージ前の機械検証)
        working-directory: content
